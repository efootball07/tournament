<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eFootball Tournament</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #004D9C;
      --blue-light: #0063C8;
      --blue-dim: #003A75;
      --red: #A50044;
      --red-light: #CC0055;
      --gold: #EDBB4A;
      --gold-dim: #D4A030;
      --bg: #06080F;
      --surface: #0C1020;
      --surface2: #111828;
      --surface3: #162035;
      --border: rgba(255,255,255,0.07);
      --border-strong: rgba(255,255,255,0.14);
      --text: #EEF2FF;
      --muted: #6878A8;
      --win: #4ADE80;
      --draw: #EDBB4A;
      --loss: #F87171;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; }
    body { min-height: 100vh; }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 60px;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 24px; letter-spacing: 2px;
      display: flex; align-items: center; gap: 10px;
    }
    .logo-badge {
      display: flex; gap: 0;
      border-radius: 4px; overflow: hidden;
    }
    .logo-b { background: var(--blue); color: #fff; padding: 3px 7px; font-size: 20px; }
    .logo-r { background: var(--red); color: #fff; padding: 3px 7px; font-size: 20px; }
    .logo-text { color: var(--text); letter-spacing: 2px; }
    .logo-text span { color: var(--gold); }

    #reset-btn {
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 500;
      color: var(--muted); background: none;
      border: 1px solid var(--border); border-radius: 6px;
      padding: 6px 12px; cursor: pointer; transition: all 0.2s;
      display: none;
    }
    #reset-btn:hover { color: var(--text); border-color: var(--border-strong); }

    main { max-width: 640px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }

    .screen { display: none; }
    .screen.active { display: block; }

    /* SETUP */
    .setup-hero { text-align: center; padding: 2rem 0 2.5rem; }
    .setup-hero .crest { font-size: 52px; margin-bottom: 1rem; display: block; }
    .setup-hero h1 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 42px; letter-spacing: 3px;
      color: var(--text); line-height: 1; margin-bottom: 8px;
    }
    .setup-hero h1 span { color: var(--gold); }
    .setup-hero p { color: var(--muted); font-size: 14px; }

    .players-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 10px; margin-bottom: 1.5rem;
    }
    .player-setup-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
    }
    .player-setup-card .card-label {
      font-size: 11px; font-weight: 600;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 10px;
      display: flex; align-items: center; gap: 6px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .d1 { background: var(--blue-light); }
    .d2 { background: var(--red-light); }
    .d3 { background: var(--gold); }

    .player-setup-card input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px; font-weight: 500;
      color: var(--text); outline: none;
      transition: border-color 0.2s;
    }
    .player-setup-card input:focus { border-color: var(--blue-light); }
    .player-setup-card input::placeholder { color: var(--muted); font-weight: 400; }

    .start-btn {
      width: 100%;
      background: linear-gradient(90deg, var(--blue) 0%, var(--red) 100%);
      color: #fff;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px; letter-spacing: 2px;
      border: none; border-radius: 12px;
      padding: 16px; cursor: pointer;
      transition: all 0.2s;
    }
    .start-btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .start-btn:active { transform: translateY(0); }
    .setup-err { color: var(--loss); font-size: 13px; text-align: center; margin-bottom: 10px; display: none; }

    /* TABS */
    .tabs {
      display: flex; gap: 2px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      flex: 1; padding: 8px 4px;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
      border: none; background: transparent;
      color: var(--muted); border-radius: 8px;
      cursor: pointer; transition: all 0.15s;
    }
    .tab-btn.active {
      background: var(--surface3);
      color: var(--text);
      border: 1px solid var(--border-strong);
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* STATUS BAR */
    .status-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.5rem; font-size: 13px;
    }
    .status-text { color: var(--text); font-weight: 500; }
    .status-pill {
      font-size: 11px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase; padding: 4px 10px; border-radius: 20px;
      background: rgba(0,99,200,0.2); color: #6AADFF;
    }
    .status-pill.final { background: rgba(165,0,68,0.2); color: #FF6AA0; }
    .status-pill.done { background: rgba(237,187,74,0.2); color: var(--gold); }

    /* TABLE */
    .standings-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .standings-table th {
      font-size: 10px; font-weight: 600;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--muted); text-align: left;
      padding: 6px 10px;
      border-bottom: 1px solid var(--border);
    }
    .standings-table td { padding: 12px 10px; border-bottom: 1px solid var(--border); }
    .standings-table tr:last-child td { border-bottom: none; }
    .standings-table tbody tr:hover { background: var(--surface2); }

    .finalist-row td:first-child::before {
      content: '';
      display: inline-block;
      width: 3px; height: 24px;
      background: linear-gradient(180deg, var(--blue-light), var(--red));
      border-radius: 2px;
      margin-right: 8px;
      vertical-align: middle;
    }

    .rank-num { color: var(--muted); font-size: 12px; font-weight: 600; }
    .player-cell { display: flex; align-items: center; gap: 8px; }
    .pts-cell { font-size: 16px; font-weight: 700; color: var(--text); }
    .finalist-badge {
      font-size: 9px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase;
      background: rgba(0,99,200,0.2); color: #6AADFF;
      padding: 2px 7px; border-radius: 10px; margin-left: 6px;
    }

    /* MATCH CARDS */
    .round-label {
      font-size: 11px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--muted);
      margin: 1.5rem 0 10px;
    }
    .round-label:first-child { margin-top: 0; }

    .match-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 8px;
    }
    .match-card.pending { border-left: 3px solid var(--blue); }
    .match-card.done-win { border-left: 3px solid var(--blue-light); }
    .match-card.done-draw { border-left: 3px solid var(--gold); }

    .match-teams {
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 10px;
    }
    .match-team { flex: 1; display: flex; align-items: center; gap: 8px; }
    .match-team.away { justify-content: flex-end; flex-direction: row-reverse; }
    .match-team-name { font-size: 13px; font-weight: 600; color: var(--text); }

    .score-display {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px; letter-spacing: 4px;
      color: var(--text); min-width: 70px; text-align: center;
    }

    .score-entry { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .score-entry input[type=number] {
      width: 50px; height: 40px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px; text-align: center;
      color: var(--text); outline: none;
      transition: border-color 0.2s;
    }
    .score-entry input[type=number]:focus { border-color: var(--blue-light); }
    .score-entry input[type=number]::-webkit-inner-spin-button,
    .score-entry input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    .score-dash-entry { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--muted); }

    .save-match-btn {
      background: linear-gradient(90deg, var(--blue) 0%, var(--red) 100%);
      color: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: 12px; font-weight: 700;
      border: none; border-radius: 8px;
      padding: 8px 14px; cursor: pointer; transition: opacity 0.2s;
    }
    .save-match-btn:hover { opacity: 0.85; }

    .edit-btn {
      font-size: 11px; font-weight: 600;
      color: var(--muted); background: none;
      border: 1px solid var(--border);
      border-radius: 6px; padding: 5px 10px;
      cursor: pointer; transition: all 0.15s;
    }
    .edit-btn:hover { color: var(--text); border-color: var(--border-strong); }

    .rbadge {
      font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
      text-transform: uppercase; padding: 3px 8px; border-radius: 6px;
    }
    .rbadge-win { background: rgba(74,222,128,0.12); color: var(--win); }
    .rbadge-draw { background: rgba(237,187,74,0.12); color: var(--draw); }
    .rbadge-loss { background: rgba(248,113,113,0.12); color: var(--loss); }

    /* FINAL */
    .final-locked { text-align: center; padding: 3rem 1rem; color: var(--muted); }
    .final-locked .lock-icon { font-size: 48px; margin-bottom: 12px; display: block; }
    .final-locked p { font-size: 14px; }

    .finalists-row {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 10px; margin-bottom: 1.5rem;
    }
    .finalist-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem; text-align: center;
    }
    .finalist-card .big-av {
      width: 52px; height: 52px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700;
      margin: 0 auto 8px;
    }
    .finalist-card .fn-name { font-size: 16px; font-weight: 600; }
    .finalist-card .fn-pts { font-size: 12px; color: var(--muted); margin-top: 2px; }

    .final-match-card {
      background: var(--surface);
      border: 1px solid var(--red);
      border-radius: 14px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }
    .final-label {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px; letter-spacing: 3px;
      background: linear-gradient(90deg, #6AADFF, #FF6AA0);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-align: center; margin-bottom: 1rem;
    }

    .champion-card {
      background: linear-gradient(135deg, rgba(0,77,156,0.15), rgba(165,0,68,0.1));
      border: 1px solid rgba(237,187,74,0.4);
      border-radius: 14px; padding: 2rem;
      text-align: center; margin-bottom: 1rem;
    }
    .champion-card .trophy { font-size: 48px; margin-bottom: 12px; display: block; }
    .champion-card .champ-label {
      font-size: 11px; font-weight: 700;
      letter-spacing: 2px; text-transform: uppercase;
      color: var(--gold); margin-bottom: 6px;
    }
    .champion-card .champ-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 40px; letter-spacing: 3px;
      color: var(--text); line-height: 1;
    }
    .champion-card .champ-score { font-size: 13px; color: var(--muted); margin-top: 8px; }

    /* PROFILES */
    .profiles-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem; cursor: pointer;
      transition: all 0.2s;
    }
    .profile-card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
    .profile-card .pc-av {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; font-weight: 700; margin-bottom: 10px;
    }
    .profile-card .pc-name { font-size: 15px; font-weight: 600; margin-bottom: 2px; }
    .profile-card .pc-pts { font-size: 12px; color: var(--muted); }

    .back-btn {
      font-size: 13px; color: var(--muted);
      background: none; border: none; cursor: pointer;
      display: flex; align-items: center; gap: 4px;
      margin-bottom: 1.5rem; padding: 0; transition: color 0.15s;
    }
    .back-btn:hover { color: var(--text); }

    .profile-detail-header {
      display: flex; align-items: center; gap: 14px;
      margin-bottom: 1.5rem;
    }
    .pd-big-av {
      width: 56px; height: 56px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 700; flex-shrink: 0;
    }

    .stats-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 8px; margin-bottom: 1.5rem;
    }
    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 14px;
    }
    .stat-box .sb-label {
      font-size: 10px; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 4px;
    }
    .stat-box .sb-val {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 30px; letter-spacing: 1px;
      color: var(--text); line-height: 1;
    }

    .wdl-row { display: flex; gap: 8px; margin-bottom: 1.5rem; }
    .wdl-pill { font-size: 12px; font-weight: 700; padding: 5px 14px; border-radius: 20px; }
    .wdl-w { background: rgba(74,222,128,0.12); color: var(--win); }
    .wdl-d { background: rgba(237,187,74,0.12); color: var(--draw); }
    .wdl-l { background: rgba(248,113,113,0.12); color: var(--loss); }

    .history-section h3 {
      font-size: 11px; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      color: var(--muted); margin-bottom: 10px;
    }
    .history-row {
      display: flex; align-items: center;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }
    .history-row:last-child { border-bottom: none; }
    .hr-opp { color: var(--text); font-weight: 500; }
    .hr-round { font-size: 11px; color: var(--muted); margin-left: 6px; }
    .hr-right { display: flex; align-items: center; gap: 8px; }
    .hr-score { font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px; }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-badge">
        <span class="logo-b">FC</span>
        <span class="logo-r">B</span>
      </div>
      <span class="logo-text">eFootball <span>Cup</span></span>
    </div>
    <button id="reset-btn" onclick="resetApp()">↺ Reset</button>
  </header>

  <main>
    <!-- SETUP -->
    <div id="screen-setup" class="screen active">
      <div class="setup-hero">
        <span class="crest">🔵🔴</span>
        <h1>Més que<br><span>un Club</span></h1>
        <p>Enter all 3 players to generate the fixture list</p>
      </div>
      <div class="players-grid">
        <div class="player-setup-card">
          <div class="card-label"><span class="dot d1"></span>Player 1</div>
          <input type="text" id="p1" placeholder="e.g. Rahim" maxlength="16">
        </div>
        <div class="player-setup-card">
          <div class="card-label"><span class="dot d2"></span>Player 2</div>
          <input type="text" id="p2" placeholder="e.g. Karim" maxlength="16">
        </div>
        <div class="player-setup-card">
          <div class="card-label"><span class="dot d3"></span>Player 3</div>
          <input type="text" id="p3" placeholder="e.g. Sohel" maxlength="16">
        </div>
      </div>
      <div class="setup-err" id="setup-err">Please enter all 3 player names.</div>
      <button class="start-btn" onclick="startTournament()">GENERATE FIXTURES</button>
    </div>

    <!-- MAIN APP -->
    <div id="screen-main" class="screen">
      <div class="status-bar">
        <span class="status-text" id="status-text">Group stage in progress</span>
        <span class="status-pill" id="status-pill">LIVE</span>
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="tab-table" onclick="showTab('table')">TABLE</button>
        <button class="tab-btn" id="tab-matches" onclick="showTab('matches')">MATCHES</button>
        <button class="tab-btn" id="tab-final" onclick="showTab('final')">FINAL</button>
        <button class="tab-btn" id="tab-profiles" onclick="showTab('profiles')">PLAYERS</button>
      </div>

      <div id="tab-content-table" class="tab-content active">
        <table class="standings-table">
          <thead>
            <tr>
              <th>#</th><th>Player</th><th>P</th><th>W</th>
              <th>D</th><th>L</th><th>GF</th><th>GA</th><th>GD</th><th>Pts</th>
            </tr>
          </thead>
          <tbody id="standings-body"></tbody>
        </table>
        <p style="font-size:11px;color:var(--muted);margin-top:12px;text-align:center;">Top 2 advance to the final · Win = 3pts · Draw = 1pt</p>
      </div>

      <div id="tab-content-matches" class="tab-content">
        <div id="matches-list"></div>
      </div>

      <div id="tab-content-final" class="tab-content">
        <div id="final-content"></div>
      </div>

      <div id="tab-content-profiles" class="tab-content">
        <div id="profiles-grid-wrap"></div>
        <div id="profile-detail-wrap" style="display:none;"></div>
      </div>
    </div>
  </main>

<script>

  const BIN_ID = "6a19695c21f9ee59d299179f";
const API_KEY = "$2a$10$hHNJwr0zLsTYIAzcGRQeHOg/HVqfWziMgmmiQ5H1k3PIeqol69Y.m";


let state = { players: [], matches: [], finalMatch: null, phase: 'setup' };






async function loadState() {
  const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
    headers: {
      "X-Master-Key": API_KEY
    }
  });

  const data = await res.json();
  return data.record;
}

async function saveState() {
  await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
    method: "PUT",
    headers: {
      "Content-Type": "application/json",
      "X-Master-Key": API_KEY
    },
    body: JSON.stringify(state)
  });
}










const AV_COLORS = [
  { bg:'rgba(0,99,200,0.2)', fg:'#6AADFF' },
  { bg:'rgba(165,0,68,0.2)', fg:'#FF6AA0' },
  { bg:'rgba(237,187,74,0.2)', fg:'#EDBB4A' }
];

function initials(name) {
  return name.split(' ').map(w => w[0]).join('').toUpperCase().slice(0,2);
}

function avatarEl(idx, name, size) {
  size = size || 30;
  const c = AV_COLORS[idx % 3];
  const fs = size <= 32 ? 11 : size <= 44 ? 14 : size <= 52 ? 16 : 20;
  return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:'+c.bg+';color:'+c.fg+';display:flex;align-items:center;justify-content:center;font-size:'+fs+'px;font-weight:700;flex-shrink:0;">'+initials(name)+'</div>';
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function generateMatches(count) {
  const pairs = [];
  for (let i = 0; i < count; i++)
    for (let j = i+1; j < count; j++)
      pairs.push([i,j]);
  shuffle(pairs);
  let id = 0;
  const r1 = pairs.map(p => ({ id: id++, round:1, home:p[0], away:p[1], homeScore:null, awayScore:null }));
  const r2 = pairs.map(p => ({ id: id++, round:2, home:p[1], away:p[0], homeScore:null, awayScore:null }));
  return [...r1, ...r2];
}

function startTournament() {
  const names = ['p1','p2','p3'].map(id => document.getElementById(id).value.trim());
  if (names.some(n => !n)) {
    document.getElementById('setup-err').style.display = 'block';
    return;
  }
  state.players = names.map((name, i) => ({ name, idx: i }));
state.matches = generateMatches(3);
state.finalMatch = null;
state.phase = 'group';

saveState();




  document.getElementById('screen-setup').classList.remove('active');
  document.getElementById('screen-main').classList.add('active');
  document.getElementById('reset-btn').style.display = 'block';
  renderAll();
}

function getStandings() {
  const stats = state.players.map((p, i) => ({
    idx:i, name:p.name, played:0, wins:0, draws:0, losses:0, gf:0, ga:0, pts:0
  }));
  state.matches.forEach(m => {
    if (m.homeScore === null) return;
    const h = stats[m.home], a = stats[m.away];
    h.played++; a.played++;
    h.gf += m.homeScore; h.ga += m.awayScore;
    a.gf += m.awayScore; a.ga += m.homeScore;
    if (m.homeScore > m.awayScore)      { h.wins++; h.pts+=3; a.losses++; }
    else if (m.homeScore < m.awayScore) { a.wins++; a.pts+=3; h.losses++; }
    else                                { h.draws++; h.pts+=1; a.draws++; a.pts+=1; }
  });
  return stats.sort((a,b) => b.pts-a.pts || (b.gf-b.ga)-(a.gf-a.ga) || b.gf-a.gf);
}

function allGroupDone() { return state.matches.every(m => m.homeScore !== null); }

function renderStandings() {
  const standings = getStandings();
  const allDone = allGroupDone();
  let html = '';
  standings.forEach((s, rank) => {
    const isFinalist = allDone && rank < 2;
    const rowClass = isFinalist ? 'finalist-row' : '';
    const fb = isFinalist ? '<span class="finalist-badge">FINAL</span>' : '';
    const gd = s.gf - s.ga;
    html += '<tr class="'+rowClass+'"><td><span class="rank-num">'+(rank+1)+'</span></td>';
    html += '<td><div class="player-cell">'+avatarEl(s.idx, s.name)+'<span>'+s.name+fb+'</span></div></td>';
    html += '<td>'+s.played+'</td><td>'+s.wins+'</td><td>'+s.draws+'</td><td>'+s.losses+'</td>';
    html += '<td>'+s.gf+'</td><td>'+s.ga+'</td><td>'+(gd>=0?'+':'')+gd+'</td>';
    html += '<td class="pts-cell">'+s.pts+'</td></tr>';
  });
  document.getElementById('standings-body').innerHTML = html;
}

function renderMatches() {
  let html = '';
  [1,2].forEach(round => {
    html += '<div class="round-label">Round '+round+'</div>';
    state.matches.filter(m => m.round === round).forEach(m => {
      const hName = state.players[m.home].name;
      const aName = state.players[m.away].name;
      if (m.homeScore !== null) {
        let cls = 'done-draw', badge = '', badgeA = '';
        if (m.homeScore > m.awayScore) { cls='done-win'; badge='<span class="rbadge rbadge-win">WIN</span>'; badgeA='<span class="rbadge rbadge-loss">LOSS</span>'; }
        else if (m.homeScore < m.awayScore) { cls='done-win'; badge='<span class="rbadge rbadge-loss">LOSS</span>'; badgeA='<span class="rbadge rbadge-win">WIN</span>'; }
        else { badge='<span class="rbadge rbadge-draw">DRAW</span>'; badgeA='<span class="rbadge rbadge-draw">DRAW</span>'; }
        html += '<div class="match-card '+cls+'">';
        html += '<div class="match-teams"><div class="match-team">'+avatarEl(m.home, hName)+'<div><div class="match-team-name">'+hName+'</div><div style="margin-top:3px;">'+badge+'</div></div></div>';
        html += '<div class="score-display">'+m.homeScore+' – '+m.awayScore+'</div>';
        html += '<div class="match-team away">'+avatarEl(m.away, aName)+'<div style="text-align:right"><div class="match-team-name">'+aName+'</div><div style="margin-top:3px;">'+badgeA+'</div></div></div></div>';
        html += '<button class="edit-btn" onclick="editMatch('+m.id+')">✎ Edit</button>';
        html += '</div>';
      } else {
        html += '<div class="match-card pending">';
        html += '<div class="match-teams"><div class="match-team">'+avatarEl(m.home, hName)+'<span class="match-team-name">'+hName+'</span></div>';
        html += '<div style="font-family:Bebas Neue,sans-serif;font-size:14px;letter-spacing:2px;color:var(--muted);">VS</div>';
        html += '<div class="match-team away">'+avatarEl(m.away, aName)+'<span class="match-team-name">'+aName+'</span></div></div>';
        html += '<div class="score-entry">';
        html += '<input type="number" id="hs-'+m.id+'" min="0" max="99" placeholder="0">';
        html += '<span class="score-dash-entry">–</span>';
        html += '<input type="number" id="as-'+m.id+'" min="0" max="99" placeholder="0">';
        html += '<button class="save-match-btn" onclick="saveMatch('+m.id+')">SAVE</button>';
        html += '</div></div>';
      }
    });
  });
  document.getElementById('matches-list').innerHTML = html;
}

function saveMatch(id) {
  const hs = parseInt(document.getElementById('hs-'+id).value);
  const as = parseInt(document.getElementById('as-'+id).value);
  if (isNaN(hs) || isNaN(as) || hs < 0 || as < 0) { alert('Please enter valid scores!'); return; }
  const m = state.matches.find(x => x.id === id);
  m.homeScore = hs; m.awayScore = as;
  renderAll();
  saveState();
}

function editMatch(id) {
  const m = state.matches.find(x => x.id === id);
  m.homeScore = null; m.awayScore = null;
  renderAll(); showTab('matches');
  saveState();
}

function renderFinal() {
  const el = document.getElementById('final-content');
  const allDone = allGroupDone();
  if (!allDone) {
    const done = state.matches.filter(m => m.homeScore !== null).length;
    el.innerHTML = '<div class="final-locked"><span class="lock-icon">🔒</span><p>Complete all '+state.matches.length+' group stage matches to unlock the final.<br><br><strong style="color:var(--text);">'+done+'/'+state.matches.length+'</strong> matches played.</p></div>';
    return;
  }
  const standings = getStandings();
  const f1 = standings[0], f2 = standings[1];
  if (!state.finalMatch) state.finalMatch = { homeScore:null, awayScore:null, p1idx:f1.idx, p2idx:f2.idx };
  const fm = state.finalMatch;

  let html = '<div class="finalists-row">';
  [f1,f2].forEach((f,i) => {
    const c = AV_COLORS[f.idx % 3];
    html += '<div class="finalist-card"><div class="big-av" style="background:'+c.bg+';color:'+c.fg+';">'+initials(f.name)+'</div>';
    html += '<div class="fn-name">'+f.name+'</div><div class="fn-pts">'+f.pts+' pts · '+(i===0?'1st':'2nd')+' place</div></div>';
  });
  html += '</div>';

  if (fm.homeScore !== null) {
    const champion = fm.homeScore > fm.awayScore ? f1 : fm.homeScore < fm.awayScore ? f2 : null;
    html += '<div class="champion-card"><span class="trophy">🏆</span>';
    if (champion) {
      html += '<div class="champ-label">Champion</div>';
      html += '<div class="champ-name">'+champion.name+'</div>';
      html += '<div class="champ-score">Final: '+fm.homeScore+' – '+fm.awayScore+'</div>';
    } else {
      html += '<div class="champ-label">Draw!</div>';
      html += '<div class="champ-name" style="font-size:28px;">'+f1.name+' '+fm.homeScore+' – '+fm.awayScore+' '+f2.name+'</div>';
    }
    html += '</div><button class="edit-btn" onclick="editFinal()">✎ Edit final result</button>';
  } else {
    html += '<div class="final-match-card"><div class="final-label">⭐ GRAND FINAL ⭐</div>';
    html += '<div class="match-teams"><div class="match-team">'+avatarEl(f1.idx, f1.name, 36)+'<span class="match-team-name">'+f1.name+'</span></div>';
    html += '<div style="font-family:Bebas Neue,sans-serif;font-size:14px;letter-spacing:2px;color:var(--muted);">VS</div>';
    html += '<div class="match-team away">'+avatarEl(f2.idx, f2.name, 36)+'<span class="match-team-name">'+f2.name+'</span></div></div>';
    html += '<div class="score-entry" style="margin-top:10px;">';
    html += '<input type="number" id="fs1" min="0" max="99" placeholder="0">';
    html += '<span class="score-dash-entry">–</span>';
    html += '<input type="number" id="fs2" min="0" max="99" placeholder="0">';
    html += '<button class="save-match-btn" onclick="saveFinal()">SAVE</button>';
    html += '</div></div>';
  }
  el.innerHTML = html;
}

function saveFinal() {
  const s1 = parseInt(document.getElementById('fs1').value);
  const s2 = parseInt(document.getElementById('fs2').value);
  if (isNaN(s1)||isNaN(s2)||s1<0||s2<0) { alert('Enter valid scores!'); return; }
  state.finalMatch.homeScore = s1; state.finalMatch.awayScore = s2;
  renderAll();
  saveState();
}

function editFinal() {
  state.finalMatch.homeScore = null; state.finalMatch.awayScore = null;
  renderAll();
  saveState();
}

function renderProfiles() {
  const standings = getStandings();
  const statsMap = {};
  standings.forEach(s => { statsMap[s.idx] = s; });
  let html = '<div class="profiles-grid">';
  state.players.forEach((p, i) => {
    const s = statsMap[i] || { played:0, wins:0, pts:0 };
    const wr = s.played > 0 ? Math.round(s.wins/s.played*100) : 0;
    const c = AV_COLORS[i%3];
    html += '<div class="profile-card" onclick="showProfile('+i+')">';
    html += '<div class="pc-av" style="background:'+c.bg+';color:'+c.fg+';">'+initials(p.name)+'</div>';
    html += '<div class="pc-name">'+p.name+'</div>';
    html += '<div class="pc-pts">'+s.pts+' pts · '+wr+'% wins</div>';
    html += '</div>';
  });
  html += '</div>';
  document.getElementById('profiles-grid-wrap').innerHTML = html;
  document.getElementById('profiles-grid-wrap').style.display = '';
  document.getElementById('profile-detail-wrap').style.display = 'none';
}

function showProfile(idx) {
  const standings = getStandings();
  const s = standings.find(x => x.idx === idx) || { played:0, wins:0, draws:0, losses:0, gf:0, ga:0, pts:0 };
  const rank = standings.findIndex(x => x.idx === idx) + 1;
  const p = state.players[idx];
  const wr = s.played > 0 ? Math.round(s.wins/s.played*100) : 0;
  const gd = s.gf - s.ga;
  const c = AV_COLORS[idx%3];

  const playerMatches = state.matches.filter(m => (m.home===idx||m.away===idx) && m.homeScore!==null);
  let histHtml = playerMatches.length === 0
    ? '<p style="color:var(--muted);font-size:13px;">No matches played yet.</p>'
    : '';
  playerMatches.forEach(m => {
    const isHome = m.home === idx;
    const oppIdx = isHome ? m.away : m.home;
    const myScore = isHome ? m.homeScore : m.awayScore;
    const oppScore = isHome ? m.awayScore : m.homeScore;
    const result = myScore > oppScore ? 'W' : myScore < oppScore ? 'L' : 'D';
    const bcls = result==='W'?'rbadge-win':result==='L'?'rbadge-loss':'rbadge-draw';
    histHtml += '<div class="history-row">';
    histHtml += '<span class="hr-opp">vs '+state.players[oppIdx].name+'<span class="hr-round">R'+m.round+'</span></span>';
    histHtml += '<div class="hr-right"><span class="hr-score">'+myScore+' – '+oppScore+'</span><span class="rbadge '+bcls+'">'+result+'</span></div>';
    histHtml += '</div>';
  });

  const html = '<button class="back-btn" onclick="renderProfiles()">← All Players</button>'
    + '<div class="profile-detail-header">'
    + '<div class="pd-big-av" style="background:'+c.bg+';color:'+c.fg+';">'+initials(p.name)+'</div>'
    + '<div><div style="font-size:20px;font-weight:700;">'+p.name+'</div>'
    + '<div style="font-size:13px;color:var(--muted);margin-top:2px;">Rank #'+rank+' · '+s.pts+' points</div></div></div>'
    + '<div class="stats-grid">'
    + '<div class="stat-box"><div class="sb-label">Matches</div><div class="sb-val">'+s.played+'</div></div>'
    + '<div class="stat-box"><div class="sb-label">Win rate</div><div class="sb-val">'+wr+'%</div></div>'
    + '<div class="stat-box"><div class="sb-label">Goals</div><div class="sb-val">'+s.gf+'</div></div>'
    + '<div class="stat-box"><div class="sb-label">Goal diff</div><div class="sb-val">'+(gd>=0?'+':'')+gd+'</div></div>'
    + '</div>'
    + '<div class="wdl-row">'
    + '<span class="wdl-pill wdl-w">'+s.wins+' W</span>'
    + '<span class="wdl-pill wdl-d">'+s.draws+' D</span>'
    + '<span class="wdl-pill wdl-l">'+s.losses+' L</span>'
    + '</div>'
    + '<div class="history-section"><h3>Match History</h3>'+histHtml+'</div>';

  document.getElementById('profiles-grid-wrap').style.display = 'none';
  document.getElementById('profile-detail-wrap').style.display = 'block';
  document.getElementById('profile-detail-wrap').innerHTML = html;
}

function updateStatusBar() {
  const done = state.matches.filter(m => m.homeScore !== null).length;
  const total = state.matches.length;
  const finalDone = state.finalMatch && state.finalMatch.homeScore !== null;
  const pill = document.getElementById('status-pill');
  const text = document.getElementById('status-text');
  if (finalDone) {
    text.textContent = 'Tournament complete!';
    pill.textContent = 'DONE'; pill.className = 'status-pill done';
  } else if (done === total) {
    text.textContent = 'Group stage done — final ready!';
    pill.textContent = 'FINAL'; pill.className = 'status-pill final';
  } else {
    text.textContent = 'Group stage: ' + done + ' / ' + total + ' played';
    pill.textContent = 'LIVE'; pill.className = 'status-pill';
  }
}

function renderAll() {
  renderStandings(); renderMatches(); renderFinal(); renderProfiles(); updateStatusBar();
}

function showTab(name) {
  ['table','matches','final','profiles'].forEach(t => {
    document.getElementById('tab-content-'+t).classList.toggle('active', t===name);
    document.getElementById('tab-'+t).classList.toggle('active', t===name);
  });
}

function resetApp() {
  if (!confirm('Reset the entire tournament? All data will be lost.')) return;
  state = { players:[], matches:[], finalMatch:null, phase:'setup' };
  document.getElementById('screen-main').classList.remove('active');
  document.getElementById('screen-setup').classList.add('active');
  document.getElementById('reset-btn').style.display = 'none';
  ['p1','p2','p3'].forEach(id => document.getElementById(id).value = '');
  showTab('table');
  saveState();
}

window.onload = async function () {
  try {
    const remoteState = await loadState();
    if (remoteState) state = remoteState;
  } catch (e) {
    console.log("No saved data yet");
  }

  if (state.players && state.players.length === 3) {
    document.getElementById('screen-setup').classList.remove('active');
    document.getElementById('screen-main').classList.add('active');
    document.getElementById('reset-btn').style.display = 'block';
    renderAll();
  }
};
</script>
</body>
</html>
