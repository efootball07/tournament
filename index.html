<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UEFA Champions League — Tournament Manager</title>
<style>
  :root{
    --font-sans:'Segoe UI', Arial, sans-serif;
    --midnight:#050F22;
    --midnight-2:#0B2745;
    --midnight-3:#122C55;
    --pitch:#12A66B;
    --pitch-dark:#063A28;
    --pitch-soft:#E7F6EE;
    --accent:#1BE3A0;
    --accent-dim:rgba(27,227,160,0.16);
    --ink:#102033;
    --panel:#FFFFFF;
    --panel-2:#F7FAFC;
    --line:#D8E0E8;
    --line-soft:#E8EDF2;
    --chalk:#102033;
    --muted:#667789;
    --gold:#D9A321;
    --gold-2:#FFDD73;
    --gold-dim:#F5DC8B;
    --silver:#B7C3D0;
    --bronze:#C58B4E;
    --win:#087443;
    --loss:#C73E3A;
    --radius:8px;
    --shadow:0 14px 32px rgba(9,25,47,0.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1100px 460px at 50% -8%, rgba(27,227,160,0.07), transparent 62%),
      linear-gradient(115deg, rgba(217,163,33,0.12), transparent 38%),
      linear-gradient(90deg, rgba(15,138,85,0.06) 1px, transparent 1px),
      linear-gradient(0deg, rgba(15,138,85,0.04) 1px, transparent 1px),
      #F3F7F5;
    background-size:auto, auto, 72px 72px, 72px 72px, auto;
    color:var(--chalk);
    font-family:var(--font-sans);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:var(--font-sans);
    font-weight:700;
    letter-spacing:0;
    text-transform:none;
    color:var(--chalk);
    margin:0;
  }
  .mono{font-family:var(--font-sans);}
  ::selection{background:#F7E7A9; color:var(--ink);}
  a{color:inherit;}

  /* ---------- Layout shell ---------- */
  .app{max-width:1180px; margin:0 auto; padding:0 24px 80px;}
  .topbar{
    position:sticky; top:0; z-index:50;
    background:linear-gradient(100deg, var(--midnight), var(--midnight-3) 55%, var(--midnight-2));
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,0.12);
    box-shadow:0 6px 22px rgba(6,27,52,0.18);
    padding:16px 24px;
  }
  .topbar::after{
    content:""; position:absolute; left:0; right:0; bottom:-1px; height:2px;
    background:linear-gradient(90deg, var(--pitch), var(--gold) 50%, var(--accent));
    opacity:0.85;
  }
  .topbar-inner{
    max-width:1180px; margin:0 auto;
    display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .brand-mark{
    width:42px; height:34px; border-radius:8px;
    background:linear-gradient(135deg, #F8D76B, var(--gold) 58%, #FFF1B8);
    display:flex; align-items:center; justify-content:center;
    color:var(--midnight); font-family:var(--font-sans); font-weight:800; font-size:13px; flex:none;
    box-shadow:0 8px 18px rgba(217,163,33,0.24);
    position:relative; overflow:hidden;
  }
  .brand-mark::after{
    content:""; position:absolute; inset:7px; border:1px solid rgba(6,27,52,0.22);
    border-radius:50%;
  }
  .brand-name-input{
    background:transparent; border:none; outline:none;
    font-family:var(--font-sans); font-weight:700; font-size:18px; letter-spacing:0; text-transform:none;
    color:#FFFFFF; border-bottom:1px solid transparent; padding:2px 0; max-width:340px;
  }
  .brand-name-input:hover, .brand-name-input:focus{border-bottom-color:rgba(255,255,255,0.38);}

  .steps{display:flex; gap:4px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.14); border-radius:999px; padding:4px;}
  .step-tab{
    display:flex; align-items:center; gap:8px;
    padding:8px 16px; border-radius:999px; font-size:13px; font-weight:600;
    color:#D4E0EF; cursor:default; user-select:none; white-space:nowrap;
    transition:color .2s, background .2s;
  }
  .step-tab .num{
    width:18px; height:18px; border-radius:50%; background:rgba(255,255,255,0.16);
    color:#F8FAFC; font-family:var(--font-sans); font-weight:700; font-size:10px;
    display:flex; align-items:center; justify-content:center; flex:none;
  }
  .step-tab.active{background:var(--gold); color:var(--midnight);}
  .step-tab.active .num{background:rgba(6,27,52,0.16); color:var(--midnight);}
  .step-tab.done{color:#A7F3D0; cursor:pointer;}
  .step-tab.done .num{background:rgba(167,243,208,0.18); color:#A7F3D0;}
  .step-tab.done:hover{color:var(--gold);}

  .icon-btn{
    background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.18); color:#D4E0EF;
    width:36px; height:36px; border-radius:8px; cursor:pointer;
    display:flex; align-items:center; justify-content:center; transition:all .15s; flex:none;
  }
  .icon-btn:hover{color:var(--loss); border-color:var(--loss);}

  main{padding-top:44px;}
  .fade-in{animation:fadeIn .4s ease both;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  .eyebrow{
    font-family:var(--font-sans); font-weight:700; font-size:12px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--pitch); margin-bottom:8px; display:block;
  }
  .lede{color:var(--muted); font-size:15px; line-height:1.6; max-width:560px; margin:10px 0 0;}

  /* ---------- Buttons ---------- */
  .btn{
    font-family:var(--font-sans); font-weight:700; font-size:14px; letter-spacing:0;
    padding:12px 22px; border-radius:8px; border:1px solid transparent; cursor:pointer;
    display:inline-flex; align-items:center; gap:10px; transition:transform .15s, box-shadow .15s, opacity .15s;
  }
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:var(--gold); color:var(--midnight); box-shadow:0 10px 22px rgba(217,163,33,0.24);}
  .btn-primary:hover{box-shadow:0 12px 26px rgba(217,163,33,0.32);}
  .btn-primary:disabled{opacity:0.35; cursor:not-allowed; box-shadow:none;}
  .btn-ghost{background:transparent; color:var(--chalk); border-color:var(--line);}
  .btn-ghost:hover{border-color:var(--gold); color:var(--gold);}
  .btn-sm{padding:8px 14px; font-size:12.5px;}

  /* ---------- Setup screen ---------- */
  .setup-grid{display:flex; flex-direction:column; gap:40px; max-width:760px;}
  .field-block label{
    display:block; font-size:12px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--muted); margin-bottom:12px;
  }
  .name-input{
    width:100%; background:var(--panel); border:1px solid var(--line); color:var(--chalk);
    font-size:16px; padding:14px 16px; border-radius:var(--radius); outline:none; font-family:var(--font-sans);
  }
  .name-input:focus{border-color:var(--gold);}

  .choice-row{display:flex; gap:14px; flex-wrap:wrap;}
  .choice-card{
    flex:1; min-width:150px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:18px 20px; cursor:pointer; transition:all .15s;
  }
  .choice-card:hover{border-color:var(--gold-dim);}
  .choice-card.selected{border-color:var(--gold); background:#FFF9E8;}
  .choice-card .big{font-family:var(--font-sans); font-weight:800; font-size:26px; letter-spacing:0;}
  .choice-card .sub{color:var(--muted); font-size:12.5px; margin-top:4px;}
  .choice-card.selected .big{color:var(--gold);}

  .team-groups{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px,1fr)); gap:18px;}
  .team-group-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px;}
  .team-group-card h3{font-size:15px; color:var(--chalk); margin-bottom:12px;}
  .team-flat-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(220px,1fr)); gap:10px 22px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:20px;
  }
  .shuffle-note{display:flex; align-items:center; gap:8px; margin-bottom:14px;}
  .shuffle-note svg{flex:none; color:var(--gold);}
  .team-input-row{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
  .team-input-row .idx{width:18px; color:var(--muted); font-family:var(--font-sans); font-weight:700; font-size:11px; flex:none;}
  .team-input{
    flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--chalk);
    font-size:13.5px; padding:9px 11px; border-radius:6px; outline:none;
  }
  .team-input:focus{border-color:var(--gold);}

  .setup-actions{display:flex; gap:14px; align-items:center; padding-top:8px;}
  .hint{font-size:12.5px; color:var(--muted);}

  .history-panel{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    overflow:hidden;
  }
  .history-panel-head{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;
    padding:16px 18px; background:var(--panel-2); border-bottom:1px solid var(--line-soft);
  }
  .history-panel-head h2{font-size:18px;}
  .history-kicker{
    font-family:var(--font-sans); font-weight:700; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--gold); margin-bottom:4px;
  }
  .last-tournament{
    display:grid; grid-template-columns:minmax(0,1.35fr) minmax(220px,0.9fr); gap:16px;
    padding:16px 18px; border-bottom:1px solid var(--line-soft);
  }
  .last-tournament h3{font-size:14px; margin-bottom:8px;}
  .history-meta{color:var(--muted); font-size:12.5px; line-height:1.5;}
  .history-meta b{color:var(--chalk); font-weight:700;}
  .summary-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px;}
  .summary-stat{
    background:var(--panel-2); border:1px solid var(--line-soft); border-radius:8px; padding:10px 12px;
  }
  .summary-stat .num{font-family:var(--font-sans); font-weight:800; font-size:24px; line-height:1; color:var(--gold);}
  .summary-stat .label{
    font-family:var(--font-sans); font-weight:700; font-size:10px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--muted); margin-top:5px;
  }
  .history-table-wrap{overflow-x:auto;}
  table.history-table{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.history-table th{
    text-align:left; font-family:var(--font-sans); font-size:10px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--muted); padding:10px 14px; border-bottom:1px solid var(--line-soft); font-weight:500;
  }
  table.history-table td{
    padding:11px 14px; border-bottom:1px solid rgba(16,24,40,0.08);
    color:var(--chalk); vertical-align:top;
  }
  table.history-table td.num-cell{font-family:var(--font-sans); color:var(--gold); font-weight:700;}
  table.history-table td.muted-cell{color:var(--muted);}
  .empty-history{
    padding:24px 18px; color:var(--muted); font-size:13px; line-height:1.5;
  }

  /* ---------- Groups screen ---------- */
  .section-head{display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:26px; flex-wrap:wrap;}
  .progress-pill{
    display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line);
    padding:8px 14px; border-radius:999px; font-size:12.5px; color:var(--muted);
  }
  .progress-track{width:90px; height:5px; background:#E4E7EC; border-radius:99px; overflow:hidden;}
  .progress-fill{height:100%; background:var(--pitch); transition:width .3s;}

  .groups-layout{display:grid; grid-template-columns:repeat(auto-fit, minmax(400px,1fr)); gap:22px;}
  .group-card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;}
  .group-card-head{
    padding:16px 20px; border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between; align-items:center;
    background:var(--panel-2);
  }
  .group-card-head h3{font-size:17px;}
  .group-card-head .tag{font-family:var(--font-sans); font-weight:700; font-size:11px; color:var(--muted);}

  table.standings{width:100%; border-collapse:collapse; font-size:12.5px;}
  table.standings th{
    text-align:center; font-family:var(--font-sans); font-size:10px; text-transform:uppercase; letter-spacing:0.06em;
    color:var(--muted); padding:10px 6px; border-bottom:1px solid var(--line-soft); font-weight:500;
  }
  table.standings th:first-child, table.standings td:first-child{text-align:left; padding-left:20px;}
  table.standings td{text-align:center; padding:9px 6px; border-bottom:1px solid rgba(16,24,40,0.08); font-family:var(--font-sans); font-size:12px;}
  table.standings td.team-cell{font-family:var(--font-sans); font-weight:600; font-size:13px;}
  table.standings tr.qualified td.team-cell{color:var(--win);}
  table.standings tr.qualified{background:var(--pitch-soft);}
  table.standings td.pts{color:var(--gold); font-weight:700;}
  .qmark{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--win); margin-right:8px; vertical-align:middle;}

  .fixtures{padding:14px 20px 20px;}
  .fixtures-label{font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--muted); margin:8px 0 10px;}
  .match-row{
    display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid rgba(16,24,40,0.08);
  }
  .match-row:last-child{border-bottom:none;}
  .match-team{flex:1; font-size:13px; font-weight:500;}
  .match-team.right{text-align:right;}
  .score-input{
    width:36px; text-align:center; background:var(--panel-2); border:1px solid var(--line); color:var(--chalk);
    font-family:var(--font-sans); font-weight:700; font-size:13px; padding:6px 2px; border-radius:6px; outline:none;
  }
  .score-input:focus{border-color:var(--gold);}
  .vs{color:var(--muted); font-size:11px; font-family:var(--font-sans); font-weight:700;}
  .played-dot{width:6px; height:6px; border-radius:50%; background:var(--line); flex:none;}
  .played-dot.done{background:var(--win);}

  .stage-footer{display:flex; justify-content:center; margin-top:36px;}

  /* ---------- Knockout screen ---------- */
  .bracket-chip{
    display:flex; flex-direction:column; gap:2px; background:var(--panel); border:1px solid var(--line);
    border-radius:var(--radius); padding:10px 14px; min-width:190px; box-shadow:0 8px 18px rgba(9,25,47,0.06);
  }
  .bracket-chip span{
    color:var(--muted); font-size:10px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase;
  }
  .bracket-chip b{font-size:13px; color:var(--chalk); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bracket-wrap{
    overflow-x:auto; padding:22px; border:1px solid rgba(6,27,52,0.16); border-radius:16px;
    background:
      linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px),
      linear-gradient(0deg, rgba(255,255,255,0.08) 1px, transparent 1px),
      linear-gradient(135deg, var(--pitch-dark), var(--midnight) 72%);
    background-size:56px 56px, 56px 56px, auto;
    box-shadow:var(--shadow);
  }
  .bracket{
    --slot-height:82px;
    position:relative; display:grid; grid-auto-flow:column; grid-auto-columns:260px; column-gap:74px;
    width:max-content; margin:0 auto; padding:8px 14px 14px;
  }
  .bracket-round{display:grid; grid-template-rows:auto 1fr; width:260px; position:relative; z-index:1;}
  .round-title{
    min-height:34px; display:flex; align-items:center; justify-content:center;
    text-align:center; font-family:var(--font-sans); font-weight:800; font-size:11px; letter-spacing:0.08em; text-transform:uppercase;
    color:#F8FAFC; margin-bottom:16px; padding:8px 14px; border-radius:999px;
    background:rgba(6,27,52,0.72); border:1px solid rgba(255,255,255,0.16);
  }
  .round-matches{
    display:grid; grid-template-rows:repeat(var(--slot-count), var(--slot-height));
  }
  .ko-match-slot{display:flex; align-items:center;}
  .ko-match-slot .ko-match{width:100%;}
  .ko-match-meta{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:9px 12px 7px 16px; border-bottom:1px solid var(--line-soft);
    background:linear-gradient(90deg, #FAFBFC, #FFFFFF);
    color:var(--muted); font-size:10px; font-weight:800; letter-spacing:0.08em; text-transform:uppercase;
  }
  .ko-match-meta .status{color:var(--pitch);}
  .ko-match-meta .status.waiting{color:var(--muted);}
  .ko-match-meta .status.decided{color:var(--win);}
  .ko-match-meta .status.tie{color:var(--loss);}
  .ko-match-meta .status.ready{color:var(--gold);}
  .ko-match::before{
    content:""; position:absolute; inset:0 auto 0 0; width:4px; background:var(--gold);
  }
  .ko-match.decided::before{background:var(--pitch);}
  .ko-match{
    position:relative; background:var(--panel); border:1px solid rgba(255,255,255,0.62); border-radius:12px; overflow:hidden;
    box-shadow:0 12px 24px rgba(3,15,30,0.2);
    outline:1px solid rgba(6,27,52,0.08);
  }
  .ko-match.decided{border-color:var(--line-soft);}
  .ko-team{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    padding:11px 12px 11px 16px; border-bottom:1px solid var(--line-soft); font-size:13px; font-weight:700;
  }
  .ko-team:last-child{border-bottom:none;}
  .ko-team.winner{color:var(--win); background:var(--pitch-soft);}
  .ko-team.loser{color:var(--muted);}
  .ko-team .tname{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ko-team .tname.tbd{color:var(--muted); font-style:italic; font-weight:400;}
  .ko-score{
    width:40px; height:30px; text-align:center; background:var(--panel-2); border:1px solid var(--line); color:var(--chalk);
    font-family:var(--font-sans); font-weight:800; font-size:13px; padding:5px 2px; border-radius:7px; outline:none; flex:none;
  }
  .ko-score:focus{border-color:var(--gold);}
  .ko-score:disabled{opacity:0.4;}
  .ko-score-static{
    width:40px; height:30px; display:flex; align-items:center; justify-content:center;
    border:1px solid var(--line-soft); background:var(--panel-2); border-radius:7px;
    text-align:center; font-family:var(--font-sans); font-weight:800; font-size:13px; flex:none;
  }
  svg.connectors{position:absolute; top:0; left:0; pointer-events:none; overflow:visible;}
  svg.connectors path{
    stroke:rgba(245,220,139,0.9); stroke-width:2.5; fill:none; stroke-linecap:round; stroke-linejoin:round;
    filter:drop-shadow(0 1px 1px rgba(6,27,52,0.35));
  }

  .stage-note{font-size:12.5px; color:var(--muted); margin-top:16px; text-align:center;}

  /* ---------- Champion screen ---------- */
  .champion-screen{
    position:relative; text-align:center; overflow:hidden;
    margin:0 -24px; padding:64px 24px 48px; border-radius:20px;
    background:
      radial-gradient(620px 380px at 50% 8%, rgba(27,227,160,0.16), transparent 60%),
      radial-gradient(900px 480px at 50% -10%, rgba(217,163,33,0.14), transparent 65%),
      linear-gradient(180deg, var(--midnight) 0%, var(--midnight-3) 46%, var(--pitch-dark) 100%);
    box-shadow:0 24px 60px rgba(5,15,34,0.35);
    isolation:isolate;
  }
  .champion-screen::before{
    content:""; position:absolute; inset:0; z-index:0; pointer-events:none;
    background:
      linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px),
      linear-gradient(0deg, rgba(255,255,255,0.05) 1px, transparent 1px);
    background-size:46px 46px, 46px 46px;
    -webkit-mask-image:radial-gradient(760px 420px at 50% 30%, #000, transparent 78%);
    mask-image:radial-gradient(760px 420px at 50% 30%, #000, transparent 78%);
  }
  .champion-screen::after{
    content:""; position:absolute; left:0; right:0; bottom:0; height:5px;
    background:linear-gradient(90deg, var(--pitch), var(--gold), var(--accent));
    z-index:1;
  }
  .confetti-layer{position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:1;}
  .confetti-piece{
    position:absolute; top:-24px; width:8px; height:14px; opacity:0.9; border-radius:1px;
    animation-name:confetti-fall; animation-timing-function:linear; animation-iteration-count:infinite;
  }
  @keyframes confetti-fall{
    0%{transform:translateY(-10%) rotate(0deg); opacity:0.95;}
    85%{opacity:0.85;}
    100%{transform:translateY(560px) rotate(340deg); opacity:0;}
  }
  .champion-content{position:relative; z-index:2;}
  .trophy-stage{position:relative; width:150px; height:150px; margin:0 auto 8px; display:flex; align-items:center; justify-content:center;}
  .trophy-glow{
    position:absolute; inset:0; border-radius:50%;
    background:radial-gradient(circle, rgba(255,221,115,0.55), rgba(217,163,33,0.16) 55%, transparent 72%);
    filter:blur(2px); animation:glow-pulse 2.4s ease-in-out infinite;
  }
  @keyframes glow-pulse{
    0%,100%{opacity:0.65; transform:scale(0.94);}
    50%{opacity:1; transform:scale(1.04);}

  }

<body>

<div class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <div class="brand-mark">CUP</div>
      <input id="tournamentName" class="brand-name-input" value="eFootball Matchday" maxlength="40" spellcheck="false">
    </div>
    <div class="steps" id="stepsNav"></div>
    <button class="icon-btn" id="resetBtn" title="Reset tournament">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </div>
</div>

<div class="app">
  <main id="main"></main>
</div>

<script>
(function(){
  "use strict";

  /* ============================= STATE ============================= */
  const STORAGE_KEY = 'matchday_tournament_state_v1';
  const HISTORY_KEY = 'matchday_player_history_v1';

  const FORMATS = {
    8: [
      {groups:2, teamsPerGroup:4, qualifiers:2, label:'2 Groups of 4', rounds:['Semifinal','Final']},
      {groups:4, teamsPerGroup:2, qualifiers:1, label:'4 Groups of 2', rounds:['Semifinal','Final']}
    ],
    16: [
      {groups:2, teamsPerGroup:8, qualifiers:4, label:'2 Groups of 8', rounds:['Quarterfinal','Semifinal','Final']},
      {groups:4, teamsPerGroup:4, qualifiers:2, label:'4 Groups of 4', rounds:['Quarterfinal','Semifinal','Final']}
    ]
  };
  const GROUP_LETTERS = ['A','B','C','D'];

  function defaultState(){
    return {
      tournamentId:createTournamentId(),
      screen:'setup',
      name:'eFootball Matchday',
      teamCount:8,
      formatIndex:0,
      teamNames:null,      // flat array of team names, length = teamCount
      groups:null,         // generated: [{name, teams:[], matches:[{home,away,homeScore,awayScore}]}]
      knockout:null,       // {roundNames:[], rounds:[[{home,away,homeScore,awayScore,winner}]]}
      champion:null,
      runnerUp:null
    };
  }

  let state = load();
  let historyStore = loadHistoryStore();

  function load(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return Object.assign(defaultState(), JSON.parse(raw));
    }catch(e){}
    return defaultState();
  }
  function createTournamentId(){
    return 't_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 8);
  }
  function defaultHistoryStore(){
    return {version:1, tournaments:[], lastTournamentId:null};
  }
  function loadHistoryStore(){
    try{
      const raw = localStorage.getItem(HISTORY_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        if(parsed && typeof parsed === 'object'){
          const store = Object.assign(defaultHistoryStore(), parsed);
          store.tournaments = Array.isArray(parsed.tournaments) ? parsed.tournaments : [];
          return store;
        }
      }
    }catch(e){}
    return defaultHistoryStore();
  }
  function save(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }catch(e){}
  }
  function saveHistoryStore(){
    try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(historyStore)); }catch(e){}
  }
  function setState(patch){
    Object.assign(state, patch);
    save();
    render();
  }

  /* ============================= HELPERS ============================= */
  function el(tag, attrs, children){
    const node = document.createElement(tag);
    if(attrs) for(const k in attrs){
      if(attrs[k] === undefined || attrs[k] === null) continue;
      if(k === 'class') node.className = attrs[k];
      else if(k === 'html') node.innerHTML = attrs[k];
      else if(k.startsWith('on')) node.addEventListener(k.slice(2), attrs[k]);
      else node.setAttribute(k, attrs[k]);
    }
    (children||[]).forEach(c=>{ if(c) node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return node;
  }
  function currentFormat(){ return FORMATS[state.teamCount][state.formatIndex]; }
  function scoreComplete(match){
    return !!match && match.homeScore !== null && match.awayScore !== null && match.homeScore !== '' && match.awayScore !== '';
  }
  function ensureTournamentId(){
    if(!state.tournamentId){
      state.tournamentId = createTournamentId();
      save();
    }
    return state.tournamentId;
  }
  function normalizePlayerName(name){
    return String(name || '').trim().toLowerCase();
  }
  function addUniquePlayerName(names, name){
    const clean = String(name || '').trim();
    if(!clean) return;
    const key = normalizePlayerName(clean);
    if(!names[key]) names[key] = clean;
  }
  function collectCurrentPlayers(){
    const names = {};
    if(Array.isArray(state.teamNames)) state.teamNames.forEach(name => addUniquePlayerName(names, name));
    if(Array.isArray(state.groups)){
      state.groups.forEach(group => {
        (group.teams || []).forEach(name => addUniquePlayerName(names, name));
        (group.matches || []).forEach(match => {
          addUniquePlayerName(names, match.home);
          addUniquePlayerName(names, match.away);
        });
      });
    }
    if(state.knockout && Array.isArray(state.knockout.rounds)){
      state.knockout.rounds.forEach(round => {
        round.forEach(match => {
          addUniquePlayerName(names, match.home);
          addUniquePlayerName(names, match.away);
          addUniquePlayerName(names, match.winner);
        });
      });
    }
    return Object.values(names);
  }
  function ensurePlayerStat(stats, name){
    const clean = String(name || '').trim();
    if(!clean) return null;
    const key = normalizePlayerName(clean);
    if(!stats[key]){
      stats[key] = {name:clean, goals:0, goalsAgainst:0, matchesPlayed:0};
    }
    return stats[key];
  }
  function addMatchStats(stats, home, away, homeScore, awayScore){
    if(homeScore === null || awayScore === null || homeScore === '' || awayScore === '') return;
    const hs = Number(homeScore);
    const as = Number(awayScore);
    if(!Number.isFinite(hs) || !Number.isFinite(as)) return;
    const homeStat = ensurePlayerStat(stats, home);
    const awayStat = ensurePlayerStat(stats, away);
    if(homeStat){
      homeStat.goals += hs;
      homeStat.goalsAgainst += as;
      homeStat.matchesPlayed += 1;
    }
    if(awayStat){
      awayStat.goals += as;
      awayStat.goalsAgainst += hs;
      awayStat.matchesPlayed += 1;
    }
  }
  function getFinalMatch(){
    if(!state.knockout || !Array.isArray(state.knockout.rounds) || !state.knockout.rounds.length) return null;
    const finalRound = state.knockout.rounds[state.knockout.rounds.length - 1];
    return finalRound && finalRound[0] ? finalRound[0] : null;
  }
  function buildCurrentTournamentSnapshot(){
    if(!state.champion || !state.groups || !state.knockout) return null;
    const stats = {};
    collectCurrentPlayers().forEach(name => ensurePlayerStat(stats, name));
    state.groups.forEach(group => {
      (group.matches || []).forEach(match => addMatchStats(stats, match.home, match.away, match.homeScore, match.awayScore));
    });
    state.knockout.rounds.forEach(round => {
      round.forEach(match => addMatchStats(stats, match.home, match.away, match.homeScore, match.awayScore));
    });

    const championKey = normalizePlayerName(state.champion);
    const runnerUpKey = normalizePlayerName(state.runnerUp);
    const players = Object.values(stats).map(player => {
      const key = normalizePlayerName(player.name);
      return {
        name:player.name,
        goals:player.goals,
        goalsAgainst:player.goalsAgainst,
        matchesPlayed:player.matchesPlayed,
        trophy:key === championKey ? 1 : 0,
        runnerUp:key === runnerUpKey ? 1 : 0
      };
    }).sort((a,b) => b.trophy - a.trophy || b.goals - a.goals || a.name.localeCompare(b.name));

    const finalMatch = getFinalMatch();
    const finalScore = finalMatch && scoreComplete(finalMatch) ? {
      home:finalMatch.home,
      away:finalMatch.away,
      homeScore:Number(finalMatch.homeScore),
      awayScore:Number(finalMatch.awayScore)
    } : null;

    return {
      id:ensureTournamentId(),
      name:state.name || 'Matchday Cup',
      completedAt:new Date().toISOString(),
      teamCount:state.teamCount,
      formatLabel:currentFormat().label,
      champion:state.champion,
      runnerUp:state.runnerUp,
      finalScore,
      totalGoals:players.reduce((sum, player) => sum + player.goals, 0),
      playerCount:players.length,
      players
    };
  }
  function upsertTournamentSnapshot(snapshot){
    const tournaments = Array.isArray(historyStore.tournaments) ? historyStore.tournaments : [];
    const index = tournaments.findIndex(tournament => tournament && tournament.id === snapshot.id);
    if(index >= 0){
      snapshot.completedAt = tournaments[index].completedAt || snapshot.completedAt;
      snapshot.updatedAt = new Date().toISOString();
      tournaments[index] = snapshot;
    } else {
      snapshot.updatedAt = snapshot.completedAt;
      tournaments.push(snapshot);
    }
    tournaments.sort((a,b) => new Date(a.completedAt || 0) - new Date(b.completedAt || 0));
    historyStore.tournaments = tournaments;
    historyStore.lastTournamentId = snapshot.id;
    saveHistoryStore();
  }
  function removeTournamentHistory(tournamentId){
    if(!tournamentId || !Array.isArray(historyStore.tournaments)) return;
    const before = historyStore.tournaments.length;
    historyStore.tournaments = historyStore.tournaments.filter(tournament => tournament && tournament.id !== tournamentId);
    if(historyStore.tournaments.length !== before){
      if(historyStore.lastTournamentId === tournamentId){
        const latest = historyStore.tournaments.slice().sort((a,b) => new Date(a.completedAt || 0) - new Date(b.completedAt || 0)).pop();
        historyStore.lastTournamentId = latest ? latest.id : null;
      }
      saveHistoryStore();
    }
  }
  function syncCompletedTournamentHistory(){
    const tournamentId = ensureTournamentId();
    if(!state.champion){
      removeTournamentHistory(tournamentId);
      return;
    }
    const snapshot = buildCurrentTournamentSnapshot();
    if(snapshot) upsertTournamentSnapshot(snapshot);
  }
  function getLastTournamentSnapshot(){
    const tournaments = Array.isArray(historyStore.tournaments) ? historyStore.tournaments : [];
    if(!tournaments.length) return null;
    const selected = tournaments.find(tournament => tournament.id === historyStore.lastTournamentId);
    if(selected) return selected;
    return tournaments.slice().sort((a,b) => new Date(a.completedAt || 0) - new Date(b.completedAt || 0)).pop();
  }
  function computePlayerHistory(){
    const players = {};
    const tournaments = (Array.isArray(historyStore.tournaments) ? historyStore.tournaments : [])
      .slice()
      .sort((a,b) => new Date(a.completedAt || 0) - new Date(b.completedAt || 0));
    tournaments.forEach(tournament => {
      (tournament.players || []).forEach(player => {
        const key = normalizePlayerName(player.name);
        if(!key) return;
        if(!players[key]){
          players[key] = {
            name:player.name,
            tournamentsPlayed:0,
            totalGoals:0,
            trophiesWon:0,
            runnerUpFinishes:0,
            lastTournament:null
          };
        }
        const row = players[key];
        const result = key === normalizePlayerName(tournament.champion)
          ? 'Champion'
          : key === normalizePlayerName(tournament.runnerUp)
            ? 'Runner-up'
            : 'Played';
        row.name = player.name || row.name;
        row.tournamentsPlayed += 1;
        row.totalGoals += Number(player.goals) || 0;
        row.trophiesWon += Number(player.trophy) || (result === 'Champion' ? 1 : 0);
        row.runnerUpFinishes += Number(player.runnerUp) || (result === 'Runner-up' ? 1 : 0);
        row.lastTournament = {
          name:tournament.name,
          completedAt:tournament.completedAt,
          goals:Number(player.goals) || 0,
          result
        };
      });
    });
    return Object.values(players).sort((a,b) => {
      return b.trophiesWon - a.trophiesWon || b.totalGoals - a.totalGoals || a.name.localeCompare(b.name);
    });
  }
  function formatDateTime(iso){
    const date = new Date(iso);
    if(!iso || Number.isNaN(date.getTime())) return 'Saved tournament';
    try{
      return new Intl.DateTimeFormat(undefined, {dateStyle:'medium', timeStyle:'short'}).format(date);
    }catch(e){
      return date.toLocaleString();
    }
  }
  function topTournamentScorers(snapshot){
    return (snapshot.players || [])
      .slice()
      .filter(player => player.goals > 0)
      .sort((a,b) => b.goals - a.goals || a.name.localeCompare(b.name))
      .slice(0, 3);
  }

  /* ---- Fisher–Yates shuffle ---- */
  function shuffle(arr){
    const a = arr.slice();
    for(let i = a.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ---- Round robin (circle method) ---- */
  function generateRoundRobin(teams){
    let arr = teams.slice();
    const hasBye = arr.length % 2 !== 0;
    if(hasBye) arr.push(null);
    const n = arr.length, half = n/2, rounds = n-1;
    const matches = [];
    let cur = arr.slice();
    for(let r=0;r<rounds;r++){
      for(let i=0;i<half;i++){
        const home = cur[i], away = cur[n-1-i];
        if(home && away){
          matches.push({ home, away, homeScore:null, awayScore:null });
        }
      }
      const fixed = cur[0];
      const rest = cur.slice(1);
      rest.unshift(rest.pop());
      cur = [fixed].concat(rest);
    }
    return matches;
  }

  /* ---- Standings ---- */
  function computeStandings(group){
    const table = {};
    group.teams.forEach(t => table[t] = {team:t, P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0});
    group.matches.forEach(m=>{
      if(m.homeScore === null || m.awayScore === null || m.homeScore === '' || m.awayScore === '') return;
      const hs = Number(m.homeScore), as = Number(m.awayScore);
      const h = table[m.home], a = table[m.away];
      h.P++; a.P++;
      h.GF += hs; h.GA += as;
      a.GF += as; a.GA += hs;
      if(hs > as){ h.W++; h.Pts += 3; a.L++; }
      else if(hs < as){ a.W++; a.Pts += 3; h.L++; }
      else { h.D++; a.D++; h.Pts += 1; a.Pts += 1; }
    });
    const list = Object.values(table);
    list.forEach(t => t.GD = t.GF - t.GA);
    list.sort((x,y) => y.Pts - x.Pts || y.GD - x.GD || y.GF - x.GF || x.team.localeCompare(y.team));
    return list;
  }

  function groupComplete(group){
    return group.matches.every(m => m.homeScore !== null && m.awayScore !== null && m.homeScore !== '' && m.awayScore !== '');
  }
  function allGroupsComplete(){
    return state.groups && state.groups.every(groupComplete);
  }
  function totalMatchProgress(){
    let played = 0, total = 0;
    state.groups.forEach(g => { total += g.matches.length; played += g.matches.filter(m => m.homeScore !== null && m.awayScore !== null && m.homeScore !== '' && m.awayScore !== '').length; });
    return {played, total};
  }

  /* ---- Knockout seeding ---- */
  function buildKnockout(){
    const fmt = currentFormat();
    const standingsByGroup = state.groups.map(computeStandings);
    const q = fmt.qualifiers;
    const qualifiers = standingsByGroup.map(s => s.slice(0, q).map(row => row.team));
    let firstRound = [];

    if(fmt.groups === 2 && q === 2){
      const [A, B] = qualifiers;
      firstRound = [ {home:A[0], away:B[1]}, {home:B[0], away:A[1]} ];
    } else if(fmt.groups === 4 && q === 1){
      const [A,B,C,D] = qualifiers.map(g=>g[0]);
      firstRound = [ {home:A, away:B}, {home:C, away:D} ];
    } else if(fmt.groups === 2 && q === 4){
      const [A, B] = qualifiers;
      firstRound = [
        {home:A[0], away:B[3]},
        {home:B[1], away:A[2]},
        {home:A[1], away:B[2]},
        {home:B[0], away:A[3]}
      ];
    } else if(fmt.groups === 4 && q === 2){
      const [A,B,C,D] = qualifiers;
      firstRound = [
        {home:A[0], away:B[1]},
        {home:C[0], away:D[1]},
        {home:B[0], away:A[1]},
        {home:D[0], away:C[1]}
      ];
    }

    const rounds = [ firstRound.map(m => ({home:m.home, away:m.away, homeScore:null, awayScore:null, winner:null})) ];
    let count = firstRound.length;
    while(count > 1){
      count = count / 2;
      rounds.push(Array.from({length:count}, () => ({home:null, away:null, homeScore:null, awayScore:null, winner:null})));
    }
    return { roundNames: fmt.rounds, rounds };
  }

  function advanceKnockout(){
    const ko = state.knockout;
    for(let r=0; r<ko.rounds.length; r++){
      const round = ko.rounds[r];
      round.forEach((m, i) => {
        if(m.homeScore !== null && m.awayScore !== null && m.homeScore !== '' && m.awayScore !== ''){
          const hs = Number(m.homeScore), as = Number(m.awayScore);
          if(hs !== as){ m.winner = hs > as ? m.home : m.away; }
          else { m.winner = null; }
        } else {
          m.winner = null;
        }
      });
      const next = ko.rounds[r+1];
      if(next){
        round.forEach((m, i) => {
          const target = next[Math.floor(i/2)];
          if(i % 2 === 0) target.home = m.winner;
          else target.away = m.winner;
          if(target.home !== undefined && (target._lastHome !== target.home || target._lastAway !== target.away)){
            // reset scores if participants changed
          }
        });
      }
    }
    const finalRound = ko.rounds[ko.rounds.length - 1];
    const finalMatch = finalRound[0];
    if(finalMatch && finalMatch.winner){
      state.champion = finalMatch.winner;
      state.runnerUp = finalMatch.winner === finalMatch.home ? finalMatch.away : finalMatch.home;
    } else {
      state.champion = null; state.runnerUp = null;
    }
  }

  function startTournament(){
    const fmt = currentFormat();
    const cleanNames = state.teamNames.map((n, i) => (n && n.trim()) ? n.trim() : `Team ${i+1}`);
    const shuffled = shuffle(cleanNames);
    const groups = Array.from({length:fmt.groups}, (_, gi) => {
      const teams = shuffled.slice(gi * fmt.teamsPerGroup, (gi+1) * fmt.teamsPerGroup);
      return {
        name: 'Group ' + GROUP_LETTERS[gi],
        teams,
        matches: generateRoundRobin(teams)
      };
    });
    setState({groups, knockout:null, champion:null, runnerUp:null, screen:'groups'});
  }

  function renderKoMatch(m, ri, mi, isFinal, roundName){
    const bothTbd = !m.home || !m.away;
    const decided = !!m.winner;
    const hasScores = m.homeScore !== null && m.awayScore !== null && m.homeScore !== '' && m.awayScore !== '';
    const isTie = hasScores && Number(m.homeScore) === Number(m.awayScore);
    const statusText = decided ? 'Decided' : (isTie ? 'Tiebreak needed' : (bothTbd ? 'Awaiting teams' : 'Ready'));
    const statusClass = decided ? 'decided' : (isTie ? 'tie' : (bothTbd ? 'waiting' : 'ready'));
    const label = isFinal ? 'Final' : (roundName + ' ' + (mi + 1));
    const box = el('div', {class:'ko-match' + (decided ? ' decided' : '')});
    box.appendChild(el('div', {class:'ko-match-meta'}, [
      el('span', {}, [label]),
      el('span', {class:'status ' + statusClass}, [statusText])
    ]));

    [['home','homeScore'], ['away','awayScore']].forEach(([teamKey, scoreKey]) => {
      const teamName = m[teamKey];
      const isWinner = decided && m.winner === teamName;
      const isLoser = decided && teamName && m.winner !== teamName;
      const row = el('div', {class:'ko-team' + (isWinner?' winner':'') + (isLoser?' loser':'')}, [
        el('span', {class:'tname' + (!teamName ? ' tbd' : '')}, [teamName || 'TBD']),

    });
    return box;
  }

  function renderKnockoutPartial(){

  function drawConnectors(){
    const bracket = document.getElementById('bracketEl');
    const svg = document.getElementById('connectorsSvg');
    if(!bracket || !svg) return;
    const rounds = Array.from(bracket.querySelectorAll('.bracket-round'));
    if(rounds.length < 2){ svg.setAttribute('width', 0); svg.setAttribute('height', 0); return; }
    const bracketRect = bracket.getBoundingClientRect();
    svg.setAttribute('width', bracket.scrollWidth);
    svg.setAttribute('height', bracket.scrollHeight);
    let paths = '';
    for(let r=0; r<rounds.length-1; r++){
      const matches = Array.from(rounds[r].querySelectorAll('.ko-match'));
      const nextMatches = Array.from(rounds[r+1].querySelectorAll('.ko-match'));
      matches.forEach((m, i) => {
        const mr = m.getBoundingClientRect();
        const target = nextMatches[Math.floor(i/2)];
        if(!target) return;
        const tr = target.getBoundingClientRect();
        const x1 = mr.right - bracketRect.left;
        const y1 = mr.top + mr.height/2 - bracketRect.top;
        const x2 = tr.left - bracketRect.left;
        const y2 = tr.top + tr.height/2 - bracketRect.top;
        const midX = x1 + (x2 - x1)/2;
        paths += `<path d="M ${x1} ${y1} H ${midX} V ${y2} H ${x2}" />`;
      });
    }
    svg.innerHTML = paths;
  }
  window.addEventListener('resize', () => { if(state.screen === 'knockout') drawConnectors(); });

  /* ============================= RENDER: CHAMPION ============================= */
  function crestInitial(name){

  function championStats(){
    let matchesPlayed = 0;
    (state.groups || []).forEach(g => (g.matches || []).forEach(m => { if(scoreComplete(m)) matchesPlayed += 1; }));
    (state.knockout ? state.knockout.rounds : []).forEach(round => round.forEach(m => { if(m.winner) matchesPlayed += 1; }));
    let finalScore = null;
    if(state.knockout && state.knockout.rounds.length){
      const finalMatch = state.knockout.rounds[state.knockout.rounds.length - 1][0];
      if(finalMatch && scoreComplete(finalMatch)) finalScore = finalMatch.homeScore + ' – ' + finalMatch.awayScore;
    }
    let fmt = null;
    try{ fmt = currentFormat(); }catch(e){ fmt = null; }
    return {
      format: fmt ? fmt.label : (state.teamCount + ' Teams'),
      teams: state.teamCount,
      matchesPlayed,
      finalScore
    };

  function buildConfetti(){
    const layer = el('div', {class:'confetti-layer'});
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduceMotion) return layer;
    const colors = ['var(--gold-2)', 'var(--gold)', 'var(--accent)', '#FFFFFF', 'var(--pitch)'];
    for(let i = 0; i < 26; i++){
      const left = Math.random() * 100;
      const delay = (Math.random() * 3.2).toFixed(2);
      const duration = (2.6 + Math.random() * 2).toFixed(2);
      const color = colors[i % colors.length];
      const rotate = Math.floor(Math.random() * 360);
      layer.appendChild(el('span', {
        class:'confetti-piece',
        style:`left:${left}%; background:${color}; animation-delay:${delay}s; animation-duration:${duration}s; transform:rotate(${rotate}deg);`
      }));
    }
    return layer;
  }

  function renderChampionScreen(){
    const wrap = el('div', {class:'champion-screen'});
    wrap.appendChild(buildConfetti());

    const content = el('div', {class:'champion-content'});

    const trophyStage = el('div', {class:'trophy-stage'});
    trophyStage.appendChild(el('div', {class:'trophy-glow'}));
    const trophy = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    trophy.setAttribute('viewBox', '0 0 24 24');
    trophy.setAttribute('class', 'trophy');
    const gradId = 'trophyGrad';
    trophy.innerHTML =
      '<defs><linearGradient id="' + gradId + '" x1="0" y1="0" x2="1" y2="1">' +
        '<stop offset="0%" style="stop-color:#FFF6D9"/>' +
        '<stop offset="45%" style="stop-color:var(--gold-2)"/>' +
        '<stop offset="100%" style="stop-color:var(--gold)"/>' +
      '</linearGradient></defs>' +
      '<g fill="none" stroke="url(#' + gradId + ')" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M8 21h8M12 17v4M7 4h10v4a5 5 0 0 1-5 5 5 5 0 0 1-5-5V4Z"/>' +
        '<path d="M7 5H4a1 1 0 0 0-1 1v1a4 4 0 0 0 4 4"/>' +
        '<path d="M17 5h3a1 1 0 0 1 1 1v1a4 4 0 0 1-4 4"/>' +
      '</g>' +
      '<path d="M9.2 6.2h5.6l-.6 3.4a2.4 2.4 0 0 1-4.4 0Z" fill="url(#' + gradId + ')" opacity="0.85"/>';
    trophyStage.appendChild(trophy);
    content.appendChild(trophyStage);

    content.appendChild(el('span', {class:'champion-ribbon'}, ['🏆 Champions']));
    content.appendChild(el('h1', {class:'champion-name'}, [state.champion || '—']));
    content.appendChild(el('div', {class:'champion-sub'}, [state.name || 'Matchday Cup']));

    if(state.champion){
      const podium = el('div', {class:'podium'});
      podium.appendChild(el('div', {class:'podium-block first'}, [
        el('div', {class:'podium-crest'}, [crestInitial(state.champion)]),
        el('div', {class:'podium-name'}, [state.champion]),
        el('div', {class:'podium-place'}, ['1st'])
      ]));
      if(state.runnerUp){
        podium.appendChild(el('div', {class:'podium-block second'}, [
          el('div', {class:'podium-crest'}, [crestInitial(state.runnerUp)]),
          el('div', {class:'podium-name'}, [state.runnerUp]),
          el('div', {class:'podium-place'}, ['2nd'])
        ]));
      }
      content.appendChild(podium);
    }

    const stats = championStats();
    const statChips = [
      {num: stats.format, label:'Format'},
      {num: stats.teams, label:'Teams'},
      {num: stats.matchesPlayed, label:'Matches Played'}
    ];
    if(stats.finalScore) statChips.push({num: stats.finalScore, label:'Final Score'});
    content.appendChild(el('div', {class:'champion-stats'},
      statChips.map(s => el('div', {class:'champion-stat'}, [
        el('div', {class:'num'}, [String(s.num)]),
        el('div', {class:'label'}, [s.label])
      ]))
    ));

    content.appendChild(el('div', {class:'champion-actions'}, [
      el('button', {class:'btn btn-ghost', onclick: () => setState({screen:'knockout'})}, ['View Bracket']),
      el('button', {class:'btn btn-primary', onclick: () => { if(confirm('Start a brand new tournament? This clears the current bracket.')) setState(defaultState()); }}, ['New Tournament'])
    ]));

    wrap.appendChild(content);
    return wrap;
  }

  /* ============================= GLOBAL CONTROLS ============================= */
  document.getElementById('tournamentName').addEventListener('input', (e) => {
    state.name = e.target.value; save();
  });
  document.getElementById('resetBtn').addEventListener('click', () => {
    if(confirm('Reset everything and start over?')){
      state = defaultState();
      save();
      render();
    }
  });

  /* ============================= INIT ============================= */
  render();
})();
</script>
</body>
</html>
